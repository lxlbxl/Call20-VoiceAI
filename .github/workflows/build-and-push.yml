name: Build and Push Docker Images

on:
  push:
    branches: [master, main]
    paths:
      - 'Dockerfile.backend'
      - 'Dockerfile.pipecat'
      - 'frontend/Dockerfile'
      - 'backend/**'
      - 'pipecat/**'
      - 'frontend/**'
  workflow_dispatch:  # Allow manual trigger

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_USERNAME: lxlbxl
  REPO_NAME: call20-voiceai

jobs:
  build-and-push-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_USERNAME }}/${{ env.REPO_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-voice-agent:
    name: Build & Push Voice Agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push voice-agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.pipecat
          push: true
          tags: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_USERNAME }}/${{ env.REPO_NAME }}-voice-agent:latest
          no-cache: true

  build-and-push-sip-gateway:
    name: Build & Push SIP Gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push sip-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.pipecat
          push: true
          tags: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_USERNAME }}/${{ env.REPO_NAME }}-sip-gateway:latest
          no-cache: true

  build-and-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_USERNAME }}/${{ env.REPO_NAME }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max