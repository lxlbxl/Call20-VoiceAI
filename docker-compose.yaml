version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: call20
      POSTGRES_USER: call20
      POSTGRES_PASSWORD: call20_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U call20"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://call20:call20_dev@postgres:5432/call20
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3102}
      DIDWW_API_KEY: ${DIDWW_API_KEY}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY}
      USD_TO_NGN_RATE: ${USD_TO_NGN_RATE:-1500}
      CALL20_ADMIN_TOKEN: ${CALL20_ADMIN_TOKEN}
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "

  # ── Voice Agent (Pipecat) ───────────────────────────────────────────────────
  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile.pipecat
    ports:
      - "8765:8765"
    environment:
      CALL20_API_URL: http://backend:8000/api/v1
      CALL20_ADMIN_TOKEN: ${CALL20_ADMIN_TOKEN}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      DIDWW_API_KEY: ${DIDWW_API_KEY}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    depends_on:
      - backend

  # ── SIP Gateway ─────────────────────────────────────────────────────────────
  sip-gateway:
    build:
      context: .
      dockerfile: Dockerfile.pipecat
    command: ["python", "sip_gateway.py"]
    ports:
      - "8766:8766"
    environment:
      CALL20_API_URL: http://backend:8000/api/v1
      VOICE_AGENT_URL: ws://voice-agent:8765/call
      CALL20_ADMIN_TOKEN: ${CALL20_ADMIN_TOKEN}
      DIDWW_API_KEY: ${DIDWW_API_KEY}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      SIP_PORT: 8766
    depends_on:
      - voice-agent

  # ── Frontend (Next.js standalone) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3102:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      API_URL: http://backend:8000/api/v1
    depends_on:
      - backend

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+asyncpg://call20:call20_dev@postgres:5432/call20
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      - postgres
      - redis
    command: celery -A app.core.celery worker --loglevel=info --concurrency=4

  # ── Celery Beat (Scheduled Tasks) ───────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+asyncpg://call20:call20_dev@postgres:5432/call20
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      - postgres
      - redis
    command: celery -A app.core.celery beat --loglevel=info

volumes:
  postgres_data:
  redis_data: